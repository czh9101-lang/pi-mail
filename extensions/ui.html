<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>pi-mail — Federation Console</title>
<style>
  :root {
    --bg: #0d1117;
    --panel: #161b22;
    --panel2: #1c232c;
    --border: #2a313a;
    --text: #e6edf3;
    --dim: #8b949e;
    --muted: #6e7681;
    --accent: #58a6ff;
    --accent2: #79c0ff;
    --success: #3fb950;
    --warning: #d29922;
    --error: #f85149;
    --broadcast: #bc8cff;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    display: flex;
    flex-direction: column;
  }
  header {
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 10px 16px;
    border-bottom: 1px solid var(--border);
    background: linear-gradient(180deg, #1b2129, #161b22);
  }
  header h1 { font-size: 16px; margin: 0; font-weight: 600; }
  header .sub { color: var(--dim); font-size: 12px; }
  header .pulse { color: var(--success); }
  nav { display: flex; gap: 4px; margin-left: auto; }
  nav button {
    background: var(--panel2);
    color: var(--dim);
    border: 1px solid var(--border);
    padding: 6px 12px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 13px;
  }
  nav button.active { color: var(--text); border-color: var(--accent); background: #1f2733; }
  nav button:hover { color: var(--text); }
  main { flex: 1; overflow: auto; padding: 16px; }
  .hidden { display: none !important; }

  .grid { display: grid; gap: 16px; }
  .card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px 16px;
  }
  .card h2 { margin: 0 0 10px; font-size: 14px; color: var(--accent2); }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 7px 10px; border-bottom: 1px solid var(--border); vertical-align: top; }
  th { color: var(--dim); font-weight: 500; font-size: 12px; text-transform: uppercase; letter-spacing: .04em; }
  tr:hover td { background: #1a2029; }
  td .you { color: var(--accent); }
  td .human-tag { color: var(--broadcast); }
  .ctx { font-variant-numeric: tabular-nums; }
  .ctx.high { color: var(--error); }
  .ctx.mid { color: var(--warning); }
  .ctx.low { color: var(--success); }

  /* Compose */
  .compose label { display: block; color: var(--dim); font-size: 12px; margin: 8px 0 3px; }
  .compose input, .compose textarea, .compose select {
    width: 100%; background: var(--panel2); color: var(--text);
    border: 1px solid var(--border); border-radius: 6px; padding: 8px 10px; font: inherit;
  }
  .compose textarea { min-height: 96px; resize: vertical; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
  .compose .row { display: flex; gap: 8px; align-items: center; }
  .btn {
    background: var(--accent); color: #04110f; border: none; border-radius: 6px;
    padding: 8px 14px; cursor: pointer; font-weight: 600; font-size: 13px;
  }
  .btn:hover { filter: brightness(1.08); }
  .btn.secondary { background: var(--panel2); color: var(--text); border: 1px solid var(--border); }
  .btn.broadcast { background: var(--broadcast); color: #120a1a; }
  .btn:disabled { opacity: .5; cursor: default; }
  .checkbox { display: flex; gap: 8px; align-items: center; color: var(--dim); font-size: 13px; }

  /* Messages */
  .msg {
    border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px;
    margin-bottom: 10px; background: var(--panel2);
  }
  .msg .head { display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
  .msg .subj { font-weight: 600; }
  .msg .meta { color: var(--dim); font-size: 12px; }
  .msg .body { white-space: pre-wrap; margin-top: 8px; color: #c9d1d9; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 13px; }
  .badge { font-size: 11px; padding: 1px 7px; border-radius: 999px; border: 1px solid var(--border); color: var(--dim); }
  .badge.broadcast { color: var(--broadcast); border-color: var(--broadcast); }
  .badge.newsession { color: var(--warning); border-color: var(--warning); }
  .msg .actions { margin-top: 8px; display: flex; gap: 8px; }
  .group { border-left: 2px solid var(--border); padding-left: 12px; margin: 6px 0 12px; }
  .group .gtitle { color: var(--dim); font-size: 12px; margin-bottom: 6px; }

  .empty { color: var(--muted); font-style: italic; padding: 8px 0; }
  .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  @media (max-width: 900px) { .two-col { grid-template-columns: 1fr; } }
  select.agentpick { background: var(--panel2); color: var(--text); border: 1px solid var(--border); border-radius: 6px; padding: 7px 10px; font: inherit; min-width: 260px; }
  .toast { position: fixed; bottom: 16px; right: 16px; background: #1f2733; border: 1px solid var(--accent); color: var(--text); padding: 10px 14px; border-radius: 8px; box-shadow: 0 6px 20px rgba(0,0,0,.4); }
  .toast.err { border-color: var(--error); }
  a { color: var(--accent2); }
</style>
</head>
<body>
<header>
  <div>
    <h1>📬 pi-mail Federation Console</h1>
    <div class="sub" id="status">connecting…</div>
  </div>
  <nav>
    <button data-tab="agents" class="active">Agents</button>
    <button data-tab="mailbox">My Mailbox</button>
    <button data-tab="history">History</button>
  </nav>
</header>
<main id="main"></main>
<div id="toast" class="toast hidden"></div>

<script>
"use strict";
const HUMAN_ID = "00000000-0000-0000-0000-000000000000";
let state = { agents: [], messages: [], human: { agentId: HUMAN_ID, agentName: "human" }, now: Date.now() };
let currentTab = "agents";
let historyAgentId = "";        // selected agent in History tab
let compose = { to: "", subject: "", body: "", newSession: false }; // sticky compose draft
let pollTimer = null;

const $ = (sel) => document.querySelector(sel);
const main = $("#main");
const el = (tag, cls, txt) => { const e = document.createElement(tag); if (cls) e.className = cls; if (txt != null) e.textContent = txt; return e; };

function fmtTime(ts) {
  if (!ts) return "—";
  const d = new Date(ts);
  return d.toLocaleString();
}
function fmtUptime(registeredAt, now) {
  if (!registeredAt) return "—";
  const s = Math.max(0, Math.round((now - registeredAt) / 1000));
  if (s < 60) return s + "s";
  if (s < 3600) return Math.round(s / 60) + "m";
  if (s < 86400) return Math.round(s / 3600) + "h";
  return Math.round(s / 86400) + "d";
}
function esc(s) { return String(s ?? ""); }
function shortId(id) { return id ? id.slice(0, 8) : ""; }
function projectOf(cwd) {
  if (!cwd) return "(no project)";
  const parts = cwd.replace(/\/+$/, "").split("/");
  return parts[parts.length - 1] || cwd;
}
function ctxClass(pct) {
  if (pct == null) return "";
  if (pct >= 80) return "high";
  if (pct >= 50) return "mid";
  return "low";
}
function toast(msg, isErr) {
  const t = $("#toast");
  t.textContent = msg;
  t.classList.toggle("err", !!isErr);
  t.classList.remove("hidden");
  clearTimeout(toast._t);
  toast._t = setTimeout(() => t.classList.add("hidden"), 3500);
}

// ── Data fetch ──────────────────────────────────────────────────────────────
async function refresh() {
  try {
    const r = await fetch("/api/state", { cache: "no-store" });
    if (!r.ok) throw new Error("HTTP " + r.status);
    state = await r.json();
    $("#status").innerHTML = "";
    const n = state.agents.filter(a => !a.isHuman).length;
    const span = el("span", "pulse", "● live");
    $("#status").appendChild(span);
    $("#status").appendChild(document.createTextNode(`  ·  ${n} agent${n === 1 ? "" : "s"}  ·  ${state.messages.length} message${state.messages.length === 1 ? "" : "s"} in history`));
    render();
  } catch (e) {
    $("#status").innerHTML = "";
    $("#status").appendChild(el("span", "", "⚠ disconnected (" + esc(e.message) + ")"));
  }
}

async function post(path, payload) {
  const r = await fetch(path, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(payload),
  });
  return r.json().catch(() => ({ ok: false, error: "invalid response" }));
}

// ── Rendering ────────────────────────────────────────────────────────────────
function render() {
  if (currentTab === "agents") renderAgents();
  else if (currentTab === "mailbox") renderMailbox();
  else if (currentTab === "history") renderHistory();
}

function sortAgents(list) {
  return [...list].sort((a, b) => {
    if (a.isHuman !== b.isHuman) return a.isHuman ? 1 : -1;
    const pa = projectOf(a.cwd), pb = projectOf(b.cwd);
    if (pa !== pb) return pa < pb ? -1 : 1;
    return a.agentName < b.agentName ? -1 : 1;
  });
}

function renderAgents() {
  main.innerHTML = "";
  const card = el("div", "card");
  card.appendChild(el("h2", null, "Connected agents"));
  const wrap = el("div");
  wrap.style.overflowX = "auto";
  const table = el("table");
  const thead = el("thead"); const trh = el("tr");
  for (const h of ["Name", "Project", "Status", "Ctx", "Model", "Uptime", "ID"]) {
    trh.appendChild(el("th", null, h));
  }
  thead.appendChild(trh); table.appendChild(thead);
  const tbody = el("tbody");
  let prevGroup = "";
  for (const a of sortAgents(state.agents)) {
    const grp = a.isHuman ? "operator" : projectOf(a.cwd);
    if (grp !== prevGroup) {
      prevGroup = grp;
      const gr = el("tr"); const gtd = el("td"); gtd.colSpan = 7;
      gtd.style.color = "var(--accent)";
      gtd.style.background = "#11161d";
      gtd.textContent = (a.isHuman ? "👤 " : "📁 ") + grp + (a.cwd && !a.isHuman ? "   " + a.cwd : "");
      gr.appendChild(gtd); tbody.appendChild(gr);
    }
    const tr = el("tr");
    // Name
    const tdN = el("td");
    const name = a.agentName + (a.isHuman ? "  (you)" : "");
    const nameEl = el("span", a.isHuman ? "human-tag" : "", name);
    tdN.appendChild(nameEl);
    tr.appendChild(tdN);
    // Project
    tr.appendChild(el("td", null, a.isHuman ? "—" : projectOf(a.cwd)));
    // Status
    tr.appendChild(el("td", null, a.status || "—"));
    // Ctx
    const tdC = el("td", "ctx " + ctxClass(a.contextPct), a.contextPct == null ? "—" : a.contextPct + "%");
    tr.appendChild(tdC);
    // Model
    tr.appendChild(el("td", null, a.model || "—"));
    // Uptime
    tr.appendChild(el("td", null, a.isHuman ? "—" : fmtUptime(a.registeredAt, state.now)));
    // ID
    tr.appendChild(el("td", null, shortId(a.agentId)));
    tbody.appendChild(tr);
  }
  table.appendChild(tbody); wrap.appendChild(table); card.appendChild(wrap);
  main.appendChild(card);
}

function messageRow(m, opts = {}) {
  const card = el("div", "msg");
  const head = el("div", "head");
  const subj = el("span", "subj", m.subject || "(no subject)");
  head.appendChild(subj);
  if (m.broadcast) head.appendChild(el("span", "badge broadcast", "broadcast"));
  if (m.newSession) head.appendChild(el("span", "badge newsession", "new session"));
  head.appendChild(el("span", "meta",
    (opts.showFrom ? "from " + m.fromName + "  ·  " : "") +
    (opts.showTo ? "to " + (m.toName || shortId(m.toId)) + "  ·  " : "") +
    fmtTime(m.timestamp) + "  ·  id " + shortId(m.id)
  ));
  card.appendChild(head);
  card.appendChild(el("div", "body", m.body || "(empty)"));
  if (opts.actions && opts.actions.length) {
    const ac = el("div", "actions");
    for (const a of opts.actions) ac.appendChild(a);
    card.appendChild(ac);
  }
  return card;
}

function renderMailbox() {
  main.innerHTML = "";
  const grid = el("div", "two-col");

  // Compose
  const composeCard = el("div", "card compose");
  composeCard.appendChild(el("h2", null, "Compose (as " + state.human.agentName + ")"));
  const labelTo = el("label", null, "To (agent name or id — leave blank for broadcast)");
  composeCard.appendChild(labelTo);
  const inputTo = el("input"); inputTo.value = compose.to; inputTo.placeholder = "e.g. portal-web-worker";
  const dl = el("datalist"); dl.id = "agent-names";
  for (const a of state.agents) { if (a.isHuman) continue; const o = el("option"); o.value = a.agentName; dl.appendChild(o); }
  inputTo.setAttribute("list", "agent-names");
  composeCard.appendChild(dl); composeCard.appendChild(inputTo);

  composeCard.appendChild(el("label", null, "Subject"));
  const inputSubj = el("input"); inputSubj.value = compose.subject;
  composeCard.appendChild(inputSubj);

  composeCard.appendChild(el("label", null, "Body"));
  const taBody = el("textarea"); taBody.value = compose.body;
  composeCard.appendChild(taBody);

  const cbWrap = el("div", "checkbox");
  const cb = el("input"); cb.type = "checkbox"; cb.id = "ns"; cb.checked = compose.newSession;
  const cbLabel = el("label", null, "Start fresh session on recipient (newSession)");
  cbLabel.setAttribute("for", "ns"); cbLabel.style.margin = "0";
  cbWrap.appendChild(cb); cbWrap.appendChild(cbLabel);
  composeCard.appendChild(cbWrap);

  const btnRow = el("div", "row");
  btnRow.style.marginTop = "10px";
  const sendBtn = el("button", "btn", "Send");
  const bcastBtn = el("button", "btn broadcast", "Broadcast to all");
  btnRow.appendChild(sendBtn); btnRow.appendChild(bcastBtn);
  composeCard.appendChild(btnRow);

  // keep draft in sync
  inputTo.addEventListener("input", () => compose.to = inputTo.value);
  inputSubj.addEventListener("input", () => compose.subject = inputSubj.value);
  taBody.addEventListener("input", () => compose.body = taBody.value);
  cb.addEventListener("change", () => compose.newSession = cb.checked);

  sendBtn.addEventListener("click", async () => {
    if (!compose.to.trim()) { toast("Add a recipient, or use Broadcast", true); return; }
    sendBtn.disabled = true;
    const r = await post("/api/send", { to: compose.to.trim(), subject: compose.subject, body: compose.body, newSession: compose.newSession });
    sendBtn.disabled = false;
    if (r.ok) { toast("✉ Sent to " + compose.to.trim()); compose.subject = ""; compose.body = ""; compose.newSession = false; inputSubj.value = ""; taBody.value = ""; cb.checked = false; refresh(); }
    else toast("❌ " + (r.error || "send failed"), true);
  });
  bcastBtn.addEventListener("click", async () => {
    bcastBtn.disabled = true;
    const r = await post("/api/broadcast", { subject: compose.subject, body: compose.body });
    bcastBtn.disabled = false;
    if (r.ok) { toast("📡 Broadcast to " + r.recipients + " agent" + (r.recipients === 1 ? "" : "s")); compose.subject = ""; compose.body = ""; inputSubj.value = ""; taBody.value = ""; refresh(); }
    else toast("❌ " + (r.error || "broadcast failed"), true);
  });

  grid.appendChild(composeCard);

  // Inbox + Outbox
  const right = el("div");
  const inboxCard = el("div", "card");
  inboxCard.appendChild(el("h2", null, "Inbox (mail to you)"));
  const inbox = state.messages.filter(m => m.toId === HUMAN_ID && !m.archived)
    .sort((a, b) => b.timestamp - a.timestamp);
  if (!inbox.length) inboxCard.appendChild(el("div", "empty", "No mail yet."));
  for (const m of inbox) {
    const replyBtn = el("button", "btn secondary", "Reply");
    replyBtn.addEventListener("click", () => { compose.to = m.fromName || m.fromId; inputTo.value = compose.to; compose.subject = m.subject.startsWith("Re:") ? m.subject : "Re: " + m.subject; inputSubj.value = compose.subject; compose.body = ""; taBody.value = ""; currentTab = "mailbox"; render(); inputTo.scrollIntoView(); });
    const archiveBtn = el("button", "btn secondary", "Archive");
    archiveBtn.addEventListener("click", async () => { await post("/api/archive", { id: m.id }); refresh(); });
    inboxCard.appendChild(messageRow(m, { showFrom: true, actions: [replyBtn, archiveBtn] }));
  }
  right.appendChild(inboxCard);

  const outboxCard = el("div", "card");
  outboxCard.appendChild(el("h2", null, "Outbox (mail you sent)"));
  const outbox = state.messages.filter(m => m.fromId === HUMAN_ID)
    .sort((a, b) => b.timestamp - a.timestamp);
  if (!outbox.length) outboxCard.appendChild(el("div", "empty", "Nothing sent yet."));
  // Group broadcasts together.
  const groups = new Map(); // broadcastId -> [msgs]
  const standalone = [];
  for (const m of outbox) {
    if (m.broadcastId) { if (!groups.has(m.broadcastId)) groups.set(m.broadcastId, []); groups.get(m.broadcastId).push(m); }
    else standalone.push(m);
  }
  for (const m of standalone) outboxCard.appendChild(messageRow(m, { showTo: true }));
  for (const [bid, msgs] of groups) {
    const g = el("div", "group");
    g.appendChild(el("div", "gtitle", `📡 broadcast · ${msgs.length} recipient${msgs.length === 1 ? "" : "s"} · ${fmtTime(msgs[0].timestamp)}`));
    for (const m of msgs.sort((a, b) => a.toName < b.toName ? -1 : 1)) g.appendChild(messageRow(m, { showTo: true }));
    outboxCard.appendChild(g);
  }
  right.appendChild(outboxCard);

  grid.appendChild(right);
  main.appendChild(grid);
}

function renderHistory() {
  main.innerHTML = "";
  const card = el("div", "card");
  card.appendChild(el("h2", null, "Mail history per agent"));
  const pick = el("select", "agentpick");
  const def = el("option"); def.value = ""; def.textContent = "— select an agent —"; pick.appendChild(def);
  const sorted = sortAgents(state.agents);
  for (const a of sorted) {
    const o = el("option"); o.value = a.agentId;
    o.textContent = (a.isHuman ? "👤 " : "  ") + a.agentName + (a.isHuman ? " (you)" : "");
    pick.appendChild(o);
  }
  if (historyAgentId) pick.value = historyAgentId;
  card.appendChild(pick);
  card.appendChild(el("div", null, "")).style.height = "10px";

  const list = el("div"); list.style.marginTop = "8px";
  if (!historyAgentId) {
    list.appendChild(el("div", "empty", "Pick an agent to see all mail delivered to it (including archived and broadcasts)."));
  } else {
    const msgs = state.messages.filter(m => m.toId === historyAgentId)
      .sort((a, b) => b.timestamp - a.timestamp);
    if (!msgs.length) list.appendChild(el("div", "empty", "No mail for this agent."));
    for (const m of msgs) list.appendChild(messageRow(m, { showFrom: true }));
  }
  card.appendChild(list);
  main.appendChild(card);

  pick.addEventListener("change", () => { historyAgentId = pick.value; renderHistory(); });
}

// ── Tabs + polling ───────────────────────────────────────────────────────────
document.querySelectorAll("nav button").forEach(b => {
  b.addEventListener("click", () => {
    document.querySelectorAll("nav button").forEach(x => x.classList.remove("active"));
    b.classList.add("active");
    currentTab = b.dataset.tab;
    render();
  });
});

refresh();
pollTimer = setInterval(refresh, 3000);
</script>
</body>
</html>
