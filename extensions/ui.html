<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>pi-mail — Federation Console</title>
<link rel="stylesheet" href="/ui.css" />
<!-- Apply persisted theme before first paint to avoid a flash of the wrong theme.
     Handles dark (default, no attribute), light, and system (follows OS). -->
<script>
  (function(){
    try {
      var t = localStorage.getItem("pi-mail-theme");
      var light = t === "light" ||
        (t === "system" && matchMedia("(prefers-color-scheme: light)").matches);
      if (light) document.documentElement.setAttribute("data-theme", "light");
    } catch(e){}
  })();
</script>
<script src="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/lib/xterm.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@xterm/addon-fit@0.10.0/lib/addon-fit.min.js"></script>
</head>
<body>
<header>
  <div>
    <h1>📬 pi-mail Federation Console</h1>
    <div class="sub" id="status">connecting…</div>
  </div>
  <nav>
    <button data-tab="agents" class="active">Agents</button>
    <button data-tab="board">Board</button>
    <button data-tab="backlog">Backlog</button>
    <button data-tab="mailbox">Mailbox</button>
    <button data-tab="history">History</button>
    <button data-tab="costs">Costs</button>
    <button data-tab="settings">Settings</button>
    <button data-tab="logs">Logs</button>
    <button id="projects-btn" title="Manage projects (favorites)">📁 Projects</button>
    <button id="theme-toggle" class="theme-toggle" title="Switch theme (dark/light/system)" aria-label="Toggle theme">🌙</button>
  </nav>
</header>
<main id="main"></main>
<div id="toast" class="toast hidden"></div>

<!-- Split for readability (each file ≤400 lines). Classic scripts share the
     global lexical scope, so top-level let/const/function are visible across
     files. Order matters: core state/helpers → board (cards/modal/settings)
     → spawn+terminal → mailbox → app (tab renderers + routing bootstrap). -->
<script src="/ui-core.js"></script>
<script src="/ui-board.js"></script>
<script src="/ui-board-modal.js"></script>
<script src="/ui-board-settings.js"></script>
<script src="/ui-spawn.js"></script>
<script src="/ui-terminal.js"></script>
<script src="/ui-mailbox.js"></script>
<script src="/ui-logs.js"></script>
<script src="/ui-costs.js"></script>
<script src="/ui-app.js"></script>
</body>
</html>
