<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>pi-mail — Federation Console</title>
<style>
  :root {
    --bg: #0d1117;
    --panel: #161b22;
    --panel2: #1c232c;
    --border: #2a313a;
    --text: #e6edf3;
    --dim: #8b949e;
    --muted: #6e7681;
    --accent: #58a6ff;
    --accent2: #79c0ff;
    --success: #3fb950;
    --warning: #d29922;
    --error: #f85149;
    --broadcast: #bc8cff;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    display: flex;
    flex-direction: column;
  }
  header {
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 10px 16px;
    border-bottom: 1px solid var(--border);
    background: linear-gradient(180deg, #1b2129, #161b22);
  }
  header h1 { font-size: 16px; margin: 0; font-weight: 600; }
  header .sub { color: var(--dim); font-size: 12px; }
  header .pulse { color: var(--success); }
  nav { display: flex; gap: 4px; margin-left: auto; }
  nav button {
    background: var(--panel2);
    color: var(--dim);
    border: 1px solid var(--border);
    padding: 8px 14px;
    min-height: 40px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 13px;
  }
  nav button.active { color: var(--text); border-color: var(--accent); background: #1f2733; }
  nav button:hover { color: var(--text); }
  main { flex: 1; overflow: auto; padding: 16px; }
  .hidden { display: none !important; }

  .grid { display: grid; gap: 16px; }
  .card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px 16px;
  }
  .card h2 { margin: 0 0 10px; font-size: 14px; color: var(--accent2); }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 7px 10px; border-bottom: 1px solid var(--border); vertical-align: top; }
  th { color: var(--dim); font-weight: 500; font-size: 12px; text-transform: uppercase; letter-spacing: .04em; }
  tr:hover td { background: #1a2029; }
  td .you { color: var(--accent); }
  td .human-tag { color: var(--broadcast); }
  .ctx { font-variant-numeric: tabular-nums; }
  .ctx.high { color: var(--error); }
  .ctx.mid { color: var(--warning); }
  .ctx.low { color: var(--success); }

  /* Compose */
  .compose label { display: block; color: var(--dim); font-size: 12px; margin: 8px 0 3px; }
  .compose input, .compose textarea, .compose select {
    width: 100%; background: var(--panel2); color: var(--text);
    border: 1px solid var(--border); border-radius: 6px; padding: 8px 10px; font: inherit;
    font-size: 16px; /* >=16px prevents iOS auto-zoom on focus */
  }
  .compose textarea { min-height: 96px; resize: vertical; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
  .compose .row { display: flex; gap: 8px; align-items: center; }
  .btn {
    background: var(--accent); color: #04110f; border: none; border-radius: 6px;
    padding: 8px 14px; min-height: 40px; cursor: pointer; font-weight: 600; font-size: 13px;
  }
  .btn:hover { filter: brightness(1.08); }
  .btn.secondary { background: var(--panel2); color: var(--text); border: 1px solid var(--border); }
  .btn.broadcast { background: var(--broadcast); color: #120a1a; }
  .btn:disabled { opacity: .5; cursor: default; }
  .checkbox { display: flex; gap: 8px; align-items: center; color: var(--dim); font-size: 13px; }
  /* Always-visible recipient picker — <datalist> renders nothing on iOS Safari */
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
  .chip { background: var(--panel2); color: var(--dim); border: 1px solid var(--border); border-radius: 999px; padding: 5px 12px; font-size: 12px; cursor: pointer; min-height: 32px; }
  .chip:hover, .chip:active { color: var(--text); border-color: var(--accent); }

  /* Messages */
  .msg {
    border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px;
    margin-bottom: 10px; background: var(--panel2);
  }
  .msg .head { display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
  .msg .subj { font-weight: 600; }
  .msg .meta { color: var(--dim); font-size: 12px; }
  .msg .body { white-space: pre-wrap; margin-top: 8px; color: #c9d1d9; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 13px; }
  .badge { font-size: 11px; padding: 1px 7px; border-radius: 999px; border: 1px solid var(--border); color: var(--dim); }
  .badge.broadcast { color: var(--broadcast); border-color: var(--broadcast); }
  .badge.newsession { color: var(--warning); border-color: var(--warning); }
  .msg .actions { margin-top: 8px; display: flex; gap: 8px; flex-wrap: wrap; }
  .group { border-left: 2px solid var(--border); padding-left: 12px; margin: 6px 0 12px; }
  .group .gtitle { color: var(--dim); font-size: 12px; margin-bottom: 6px; }

  /* ── Task board ─────────────────────────────────────────────────────────── */
  .board-toolbar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 12px; }
  .board-toolbar .sync { color: var(--dim); font-size: 12px; }
  .board-toolbar .sync.err { color: var(--error); }
  /* Idle-agents summary row on the board: surfaces who's available for
     assignment, inline where you assign (mirrors Agents-tab statuses). */
  .idle-row { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; margin-bottom: 12px; font-size: 12px; }
  .idle-row .idle-label { color: var(--dim); }
  .idle-row .idle-chip { background: #11281f; color: var(--success); border: 1px solid #1f4d33; border-radius: 999px; padding: 2px 9px; }
  .idle-row .idle-none { color: var(--muted); font-style: italic; }
  .board { display: flex; gap: 12px; overflow-x: auto; align-items: flex-start; padding-bottom: 8px; }
  .bcol { flex: 0 0 280px; background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 10px; }
  .bcol .bhead { display: flex; align-items: baseline; gap: 8px; margin-bottom: 8px; }
  .bcol .bhead .bname { font-weight: 600; font-size: 13px; }
  .bcol .bhead .bcount { color: var(--muted); font-size: 12px; }
  .badge.jira { color: var(--accent2); border-color: var(--accent); }
  .badge.custom { color: var(--warning); border-color: var(--warning); }
  .badge.flag { color: var(--error); border-color: var(--error); }
  .badge.sub { color: var(--dim); }
  .tcard.flagged { border-color: var(--error); }
  .tcard.subtask { margin-left: 14px; border-left: 2px solid var(--border); }
  .bcol .binstr { color: var(--dim); font-size: 11px; margin-bottom: 8px; white-space: pre-wrap; border-left: 2px solid var(--warning); padding-left: 8px; }
  .tcard { background: var(--panel2); border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; margin-bottom: 8px; }
  .tcard .tsum { font-size: 13px; cursor: pointer; }
  .tcard .tkey { color: var(--accent2); font-size: 12px; margin-right: 6px; }
  .tcard .tmeta { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px; align-items: center; }
  .tcard .assignee { font-size: 11px; color: var(--broadcast); border: 1px solid var(--border); border-radius: 999px; padding: 1px 8px; }
  .tcard .assignee.none { color: var(--muted); font-style: italic; border-style: dashed; }
  .tcard select { background: var(--panel); color: var(--dim); border: 1px solid var(--border); border-radius: 6px; padding: 4px 6px; font-size: 12px; max-width: 118px; }
  .tcard .tdetail { margin-top: 8px; border-top: 1px solid var(--border); padding-top: 8px; }
  .tcard .tdesc { white-space: pre-wrap; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; color: #c9d1d9; max-height: 220px; overflow: auto; }
  .tcard .tact { margin-top: 8px; }
  .tcard .tact .a { font-size: 11px; color: var(--dim); margin-bottom: 3px; white-space: pre-wrap; }
  .tcard .tact .a b { color: var(--text); font-weight: 600; }
  .tcard textarea { width: 100%; background: var(--panel); color: var(--text); border: 1px solid var(--border); border-radius: 6px; padding: 6px 8px; font: inherit; font-size: 13px; min-height: 48px; margin-top: 6px; }
  .board-settings label { display: block; color: var(--dim); font-size: 12px; margin: 8px 0 3px; }
  .board-settings input, .board-settings textarea { width: 100%; background: var(--panel2); color: var(--text); border: 1px solid var(--border); border-radius: 6px; padding: 7px 9px; font: inherit; font-size: 14px; }
  .board-settings .colrow { border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; margin-bottom: 8px; background: var(--panel2); }
  .board-settings .colrow .rr { display: flex; gap: 8px; margin-bottom: 6px; }
  .board-settings .colrow .rr input { flex: 1; }
  .board-settings .mini { padding: 4px 9px; min-height: 28px; font-size: 12px; }
  .newtask { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 12px; }
  .newtask input { flex: 1 1 240px; background: var(--panel2); color: var(--text); border: 1px solid var(--border); border-radius: 6px; padding: 8px 10px; font: inherit; font-size: 16px; }
  @media (max-width: 640px) {
    .bcol { flex: 0 0 86vw; }
    .newtask input { flex-basis: 100%; }
  }

  .empty { color: var(--muted); font-style: italic; padding: 8px 0; }
  .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  @media (max-width: 900px) { .two-col { grid-template-columns: 1fr; } }
  select.agentpick { background: var(--panel2); color: var(--text); border: 1px solid var(--border); border-radius: 6px; padding: 7px 10px; font: inherit; font-size: 16px; min-width: 260px; }
  .toast { position: fixed; bottom: 16px; right: 16px; background: #1f2733; border: 1px solid var(--accent); color: var(--text); padding: 10px 14px; border-radius: 8px; box-shadow: 0 6px 20px rgba(0,0,0,.4); }
  .toast.err { border-color: var(--error); }
  a { color: var(--accent2); }

  /* ── Mobile ─────────────────────────────────────────────────────────────── */
  @media (max-width: 640px) {
    header { flex-wrap: wrap; gap: 8px; padding: 8px 10px; }
    header > div:first-child { flex: 1 1 100%; min-width: 0; }
    header .sub { font-size: 11px; }
    nav { margin-left: 0; width: 100%; }
    nav button { flex: 1 1 0; }
    main { padding: 10px; }
    .card { padding: 12px; }
    .two-col { grid-template-columns: 1fr; gap: 12px; }

    /* Agents table → stacked cards (label left, value right) */
    table, thead, tbody, tr, td { display: block; width: 100%; }
    thead { display: none; }
    tbody tr { background: var(--panel2); border: 1px solid var(--border); border-radius: 8px; margin-bottom: 8px; padding: 4px 0; }
    tbody td { border: none; padding: 6px 12px; display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
    tbody td::before { content: attr(data-label); color: var(--dim); font-size: 11px; text-transform: uppercase; letter-spacing: .04em; flex: 0 0 auto; }
    /* Section header rows */
    tbody tr.group-row { background: transparent; border: none; margin: 10px 0 2px; padding: 0; }
    tbody tr.group-row td { background: #11161d; border-radius: 6px; padding: 6px 10px; justify-content: flex-start; }
    tbody tr.group-row td::before { content: none; }

    .msg .head { flex-direction: column; align-items: flex-start; gap: 4px; }
    select.agentpick { min-width: 0; width: 100%; }
    /* On mobile the agents table becomes stacked cards; let the Send-mail
       action cell take a full-width tappable button instead of a label row. */
    tbody td.no-label::before { content: none; }
    tbody td.no-label { justify-content: flex-end; }
    tbody td.no-label .btn { width: 100%; }
    .toast { left: 10px; right: 10px; bottom: 10px; }
    /* Safe-area padding for notched phones */
    body { padding-bottom: env(safe-area-inset-bottom); }
  }

  /* ── Spawn agent + web terminal ─────────────────────────────────────────── */
  .spawn-modal, .term-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.6); display: flex;
    align-items: center; justify-content: center; z-index: 1000; padding: 12px;
  }
  .spawn-modal .card, .term-overlay .card {
    background: var(--panel); border: 1px solid var(--border); border-radius: 10px;
    width: 100%; max-width: 560px; max-height: 90vh; overflow: auto; padding: 16px;
  }
  .term-overlay .card { max-width: 900px; max-height: 92vh; display: flex; flex-direction: column; }
  .spawn-modal h3, .term-overlay h3 { margin: 0 0 12px; }
  .spawn-modal label { display: block; font-size: 12px; color: var(--dim); margin: 10px 0 4px; }
  .spawn-modal input, .spawn-modal select, .spawn-modal textarea {
    width: 100%; padding: 7px 9px; background: var(--bg); color: var(--text);
    border: 1px solid var(--border); border-radius: 6px; font: inherit;
  }
  .spawn-modal .picker { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
  .spawn-modal .picker select { flex: 1 1 200px; }
  .spawn-modal .crumbs { font-size: 11px; color: var(--dim); word-break: break-all; margin-top: 4px; }
  .spawn-modal .row { display: flex; gap: 8px; justify-content: flex-end; margin-top: 16px; }
  #xterm-host { flex: 1; min-height: 0; background: #000; border-radius: 6px; padding: 4px; }
  .term-overlay .bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
  .spawn-btn { font-weight: 600; }
  .badge.spawn { background: #11281f; color: var(--success); border: 1px solid #1f4d33; }

  /* ── Task detail modal ─────────────────────────────────────────────────── */
  .task-modal { position: fixed; inset: 0; background: rgba(0,0,0,0.6); display: flex;
    align-items: center; justify-content: center; z-index: 1000; padding: 12px; }
  .task-modal .card { background: var(--panel); border: 1px solid var(--border);
    border-radius: 10px; width: 100%; max-width: 720px; max-height: 90vh; overflow: auto; padding: 16px; }
  .task-modal .tm-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; margin-bottom: 4px; }
  .task-modal .tm-head h3 { margin: 0; font-size: 15px; color: var(--text); word-break: break-word; }
  .task-modal .tm-key { color: var(--accent2); font-size: 13px; margin-right: 6px; }
  .task-modal .tm-close { background: none; border: 1px solid var(--border); color: var(--dim);
    border-radius: 6px; padding: 2px 10px; cursor: pointer; font-size: 16px; line-height: 1; flex: 0 0 auto; }
  .task-modal .tm-close:hover { color: var(--text); }
  .task-modal .tm-meta { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; margin: 8px 0; }
  .task-modal .tm-desc { white-space: pre-wrap; font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 12px; color: #c9d1d9; background: var(--panel2); border: 1px solid var(--border);
    border-radius: 6px; padding: 8px 10px; max-height: 260px; overflow: auto; }
  .task-modal .tm-section { margin-top: 14px; }
  .task-modal .gtitle { font-size: 12px; color: var(--dim); margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.04em; }
  .task-modal .tm-act { max-height: 280px; overflow: auto; }
  .task-modal .tm-act .a { font-size: 12px; color: var(--dim); margin-bottom: 6px; white-space: pre-wrap;
    border-left: 2px solid var(--border); padding: 2px 0 2px 8px; }
  .task-modal .tm-act .a.progress { border-left-color: var(--accent); }
  .task-modal .tm-act .a b { color: var(--text); font-weight: 600; }
  .task-modal .tm-act .akind { font-size: 10px; color: var(--accent); border: 1px solid var(--border);
    border-radius: 999px; padding: 0 6px; margin-right: 4px; }
  .task-modal textarea { width: 100%; background: var(--panel2); color: var(--text);
    border: 1px solid var(--border); border-radius: 6px; padding: 6px 8px; font: inherit; font-size: 13px; min-height: 48px; }
  .task-modal .tm-actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-top: 8px; }
  .task-modal select { background: var(--panel2); color: var(--text); border: 1px solid var(--border);
    border-radius: 6px; padding: 4px 6px; font-size: 12px; }
</style>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/css/xterm.min.css" />
<script src="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/lib/xterm.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@xterm/addon-fit@0.10.0/lib/addon-fit.min.js"></script>
</head>
<body>
<header>
  <div>
    <h1>📬 pi-mail Federation Console</h1>
    <div class="sub" id="status">connecting…</div>
  </div>
  <nav>
    <button data-tab="agents" class="active">Agents</button>
    <button data-tab="board">Board</button>
    <button data-tab="mailbox">My Mailbox</button>
    <button data-tab="history">History</button>
  </nav>
</header>
<main id="main"></main>
<div id="toast" class="toast hidden"></div>

<script>
"use strict";
const HUMAN_ID = "00000000-0000-0000-0000-000000000000";
let state = { agents: [], messages: [], board: null, human: { agentId: HUMAN_ID, agentName: "human" }, now: Date.now() };
let currentTab = "agents";
let historyAgentId = "";        // selected agent in History tab
let compose = { to: "", subject: "", body: "", newSession: false }; // sticky compose draft
// Board UI state that must survive re-renders (poll every 3s)
let boardUi = {
  taskModalId: null,            // task whose detail modal is open
  settingsOpen: false,
  freshSession: true,           // newSession flag used when assigning
  newTask: { summary: "", column: "", level: "task", backlog: false },
  draftComments: {},            // taskId -> comment draft
  colsDraft: null,              // unsaved column edits while settings are open
  showArchive: false,           // status filter: show done (archived) tasks
};
let pollTimer = null;
let lastSig = null;

const $ = (sel) => document.querySelector(sel);
const main = $("#main");
const el = (tag, cls, txt) => { const e = document.createElement(tag); if (cls) e.className = cls; if (txt != null) e.textContent = txt; return e; };

function fmtTime(ts) {
  if (!ts) return "—";
  const d = new Date(ts);
  return d.toLocaleString();
}
function fmtUptime(registeredAt, now) {
  if (!registeredAt) return "—";
  const s = Math.max(0, Math.round((now - registeredAt) / 1000));
  if (s < 60) return s + "s";
  if (s < 3600) return Math.round(s / 60) + "m";
  if (s < 86400) return Math.round(s / 3600) + "h";
  return Math.round(s / 86400) + "d";
}
function esc(s) { return String(s ?? ""); }
function shortId(id) { return id ? id.slice(0, 8) : ""; }
function projectOf(cwd) {
  if (!cwd) return "(no project)";
  const parts = cwd.replace(/\/+$/, "").split("/");
  return parts[parts.length - 1] || cwd;
}
function ctxClass(pct) {
  if (pct == null) return "";
  if (pct >= 80) return "high";
  if (pct >= 50) return "mid";
  return "low";
}
function toast(msg, isErr) {
  const t = $("#toast");
  t.textContent = msg;
  t.classList.toggle("err", !!isErr);
  t.classList.remove("hidden");
  clearTimeout(toast._t);
  toast._t = setTimeout(() => t.classList.add("hidden"), 3500);
}

// ── Data fetch ──────────────────────────────────────────────────────────────
async function refresh() {
  try {
    const r = await fetch("/api/state", { cache: "no-store" });
    if (!r.ok) throw new Error("HTTP " + r.status);
    const next = await r.json();
    state = next;
    $("#status").innerHTML = "";
    const n = state.agents.filter(a => !a.isHuman).length;
    const span = el("span", "pulse", "● live");
    $("#status").appendChild(span);
    $("#status").appendChild(document.createTextNode(`  ·  ${n} agent${n === 1 ? "" : "s"}  ·  ${state.messages.length} message${state.messages.length === 1 ? "" : "s"} in history`));
    // Re-rendering wipes the whole DOM tree in <main>, which on mobile
    // dismisses the on-screen keyboard every poll. So:
    //  - never re-render while the user is focused inside <main> (typing),
    //  - and skip when nothing actually changed.
    const focusedInMain = document.activeElement && main.contains(document.activeElement);
    // Also suppress the poll re-render while the task detail modal is open and
    // focused — the modal lives in <body> (not #main), so the guard above
    // misses it and the 3s rebuild would dismiss the on-screen keyboard and
    // reset scroll every tick.
    const taskModal = document.getElementById("task-modal");
    const focusedInModal = !!taskModal && document.activeElement && taskModal.contains(document.activeElement);
    const sig = JSON.stringify([state.agents, state.messages, state.board]);
    if (focusedInMain || focusedInModal) { lastSig = sig; return; }
    if (sig !== lastSig) { lastSig = sig; render(); }
  } catch (e) {
    $("#status").innerHTML = "";
    $("#status").appendChild(el("span", "", "⚠ disconnected (" + esc(e.message) + ")"));
  }
}

async function post(path, payload) {
  const r = await fetch(path, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(payload),
  });
  return r.json().catch(() => ({ ok: false, error: "invalid response" }));
}

// ── Rendering ────────────────────────────────────────────────────────────────
function render() {
  if (currentTab === "agents") renderAgents();
  else if (currentTab === "board") renderBoard();
  else if (currentTab === "mailbox") renderMailbox();
  else if (currentTab === "history") renderHistory();
}

function sortAgents(list) {
  return [...list].sort((a, b) => {
    if (a.isHuman !== b.isHuman) return a.isHuman ? 1 : -1;
    const pa = projectOf(a.cwd), pb = projectOf(b.cwd);
    if (pa !== pb) return pa < pb ? -1 : 1;
    return a.agentName < b.agentName ? -1 : 1;
  });
}

function renderAgents() {
  main.innerHTML = "";
  const card = el("div", "card");
  card.appendChild(el("h2", null, "Connected agents"));
  const wrap = el("div");
  wrap.style.overflowX = "auto";
  const table = el("table");
  const thead = el("thead"); const trh = el("tr");
  for (const h of ["Name", "Project", "Status", "Ctx", "Model", "Uptime", "ID", "Actions"]) {

      gr.appendChild(gtd); tbody.appendChild(gr);
    }
    const tr = el("tr");
    // Name
    const tdN = el("td"); tdN.dataset.label = "Name";
    const name = a.agentName + (a.isHuman ? "  (you)" : "");
    tdN.appendChild(el("span", a.isHuman ? "human-tag" : "", name));
    tr.appendChild(tdN);
    // Project
    const tdP = el("td", null, a.isHuman ? "—" : projectOf(a.cwd)); tdP.dataset.label = "Project"; tr.appendChild(tdP);
    // Status
    const tdS = el("td", null, a.status || "—"); tdS.dataset.label = "Status"; tr.appendChild(tdS);
    // Ctx
    const tdC = el("td", "ctx " + ctxClass(a.contextPct), a.contextPct == null ? "—" : a.contextPct + "%"); tdC.dataset.label = "Ctx"; tr.appendChild(tdC);
    // Model
    const tdM = el("td", null, a.model || "—"); tdM.dataset.label = "Model"; tr.appendChild(tdM);
    // Uptime
    const tdU = el("td", null, a.isHuman ? "—" : fmtUptime(a.registeredAt, state.now)); tdU.dataset.label = "Uptime"; tr.appendChild(tdU);
    // ID
    const tdI = el("td", null, shortId(a.agentId)); tdI.dataset.label = "ID"; tr.appendChild(tdI);
    // Actions
    const tdA = el("td"); tdA.className = "no-label"; tdA.dataset.label = "";
    if (!a.isHuman) {
      const sendBtn = el("button", "btn secondary", "Send mail");
      sendBtn.addEventListener("click", () => {
        compose.to = a.agentName;
        setTab("mailbox");
        document.querySelector(".compose input")?.scrollIntoView({ behavior: "smooth", block: "start" });
      });
      tdA.appendChild(sendBtn);
      // Spawned agents get a Terminal + Stop button. state.spawn.sessions is
      // the daemon's tracked set (only those it spawned), so the buttons
      // only appear for spawn-managed agents — never for operator-launched ones.
      const spawned = (state.spawn?.sessions || []).find(s => s.name === a.agentName || s.agentName === a.agentName);
      if (spawned) {
        const termBtn = el("button", "btn secondary mini", "Terminal");
        termBtn.addEventListener("click", () => openTerminal(spawned.name));
        tdA.appendChild(termBtn);
        if (spawned.alive) {
          const stopBtn = el("button", "btn secondary mini", "Stop");
          stopBtn.style.borderColor = "var(--error)"; stopBtn.style.color = "var(--error)";
          stopBtn.addEventListener("click", async () => {
            if (!confirm(`Stop agent '${spawned.name}'? (kills its tmux session)`)) return;
            const r = await post("/api/spawn/stop", { name: spawned.name });
            if (r.ok) { toast("✅ Stopped " + spawned.name); refresh(); } else toast("❌ " + (r.error || "failed"), true);
          });
          tdA.appendChild(stopBtn);
        }
      }
    } else {
      tdA.appendChild(el("span", "empty", "\u2014"));
    }
    tr.appendChild(tdA);
    tbody.appendChild(tr);
  }
  table.appendChild(tbody); wrap.appendChild(table); card.appendChild(wrap);
  main.appendChild(card);
}

async function boardPost(path, payload, okMsg) {
  const r = await post(path, payload);
  if (r.ok) {
    if (r.warning) toast("⚠ " + r.warning, true);
    else if (okMsg) toast(okMsg);
    await refresh();
  } else {
    toast("❌ " + (r.error || "failed"), true);
  }
  return r;
}

function agentNames() {
  return state.agents.filter(a => !a.isHuman).map(a => a.agentName).sort();
}

/** An agent counts as "idle" (available for assignment) when it has no status
 *  set or its status starts with "idle" (set via mail_set_status, possibly
 *  with a trailing note like "idle (recon done)"). Any other status text means
 *  the agent is busy with something. */
function isIdle(a) {
  return !a.isHuman && (!a.status || a.status.trim().toLowerCase().startsWith("idle"));
}

/** Non-human agents as {name, idle}, idle-first then alphabetical — used by
 *  the board's assign dropdown so available agents surface at the top. */
function agentPickList() {
  return state.agents
    .filter(a => !a.isHuman)
    .map(a => ({ name: a.agentName, idle: isIdle(a) }))
    .sort((x, y) => (x.idle === y.idle ? x.name.localeCompare(y.name) : x.idle ? -1 : 1));
}

function isSubtask(t) { return !!(t.parentId || t.parentKey); }
function childrenOf(t, board) {
  return (board.tasks ?? []).filter(x => x.parentId === t.id || (t.key && x.parentKey === t.key));
}

function taskCard(t, board) {
  const card = el("div", "tcard" + (t.flagged ? " flagged" : "") + (isSubtask(t) ? " subtask" : ""));

  if (t.key) {

  sum.addEventListener("click", () => openTaskModal(t.id));

  const meta = el("div", "tmeta");
  meta.appendChild(el("span", "assignee" + (t.assignee ? "" : " none"), t.assignee || "unassigned"));

  }
  if (isSubtask(t)) meta.appendChild(el("span", "badge sub", "↳ " + (t.parentKey || "subtask")));

  if (t.priority) meta.appendChild(el("span", "badge", t.priority));

  // Move select — includes the Backlog/Archive pseudo-locations so a card can

/** Render the task detail modal overlay. Shows summary/key, meta, the full
 *  description (incl. any folded progress section), the COMPLETE activity
 *  timeline (all entries, progress marked distinctly), and actions: comment,
 *  add progress, move, flag/clear, assign, +subtask. Re-rendered each poll so
 *  it stays live; the comment draft is preserved in boardUi.draftComments. */
function renderTaskModal() {
  let m = $("#task-modal");
  if (!boardUi.taskModalId) { if (m) m.remove(); return; }
  const board = state.board;
  const t = (board?.tasks ?? []).find(x => x.id === boardUi.taskModalId);
  if (!t) { closeTaskModal(); return; } // task disappeared (moved off board / deleted)
  if (!m) {
    m = el("div", "task-modal"); m.id = "task-modal";

  }
  const card = el("div", "card");
  // Head
  const head = el("div", "tm-head");
  const h3 = el("h3");
  if (t.key) {
    const k = t.url ? el("a", "tm-key", "[" + t.key + "]") : el("span", "tm-key", "[" + t.key + "]");
    if (t.url) { k.href = t.url; k.target = "_blank"; }
    h3.appendChild(k);
  }
  h3.appendChild(document.createTextNode(t.summary));
  head.appendChild(h3);
  const close = el("button", "tm-close", "✕");
  close.addEventListener("click", closeTaskModal);
  head.appendChild(close);
  card.appendChild(head);
  // Meta badges
  const meta = el("div", "tm-meta");
  const col = (board.columns ?? []).find(c => c.id === t.columnId);
  const loc = t.location ?? "board";
  const locLabel = loc === "backlog" ? "📥 Backlog" : loc === "archive" ? "🗄 Archive" : (col?.name ?? t.columnId ?? "?");
  meta.appendChild(el("span", "badge " + (loc === "board" && col?.jiraStatus ? "jira" : "custom"), locLabel));
  if (t.level && t.level !== "task") meta.appendChild(el("span", "badge sub", t.level));
  meta.appendChild(el("span", "assignee" + (t.assignee ? "" : " none"), t.assignee || "unassigned"));
  if (t.jiraStatus) meta.appendChild(el("span", "badge jira", t.jiraStatus));
  if (t.origin === "local") meta.appendChild(el("span", "badge custom", "local"));
  if (t.priority) meta.appendChild(el("span", "badge", t.priority));
  if (t.flagged) {
    const fb = el("span", "badge flag", "⚠ unclear");
    fb.title = "Flagged by " + t.flagged.by + ": " + t.flagged.reason;
    meta.appendChild(fb);
  }
  if (isSubtask(t)) meta.appendChild(el("span", "badge sub", "↳ " + (t.parentKey || "subtask")));
  card.appendChild(meta);
  if (t.url) card.appendChild(el("div", "sync", "Jira: " + t.url));
  if (t.flagged) {
    const fr = el("div", "binstr", "⚠ Flagged unclear by " + t.flagged.by + " (" + fmtTime(t.flagged.ts) + "):\n" + t.flagged.reason);
    fr.style.borderLeftColor = "var(--error)";
    card.appendChild(fr);
  }
  // Description (incl. any folded "Progress so far" block)
  const dsec = el("div", "tm-section");
  dsec.appendChild(el("div", "gtitle", "Description"));
  dsec.appendChild(el("div", "tm-desc", t.description || "(no description)"));
  card.appendChild(dsec);
  // Subtasks
  const kids = childrenOf(t, board);
  if (kids.length) {
    const ssec = el("div", "tm-section");
    ssec.appendChild(el("div", "gtitle", "Subtasks"));
    for (const c of kids) {
      const cc = board.columns.find(x => x.id === c.columnId);
      const line = el("div", "a", "- [" + shortId(c.id) + "]" + (c.key ? " " + c.key : "") + " " + c.summary + " (" + (cc?.name ?? "?") + (c.assignee ? ", " + c.assignee : "") + ")");
      ssec.appendChild(line);
    }
    card.appendChild(ssec);
  }
  // Column instructions (if any)
  if (col?.instructions) {
    const isec = el("div", "tm-section");
    isec.appendChild(el("div", "gtitle", "Column instructions (" + col.name + ")"));
    isec.appendChild(el("div", "binstr", col.instructions));
    card.appendChild(isec);
  }
  // FULL activity timeline, rendered by kind (progress marked distinctly)
  const asec = el("div", "tm-section");
  asec.appendChild(el("div", "gtitle", "Activity (" + (t.activity?.length ?? 0) + ")"));
  const act = el("div", "tm-act");
  if (t.activity?.length) {
    for (const a of t.activity) {
      const row = el("div", "a" + (a.kind === "progress" ? " progress" : ""));
      if (a.kind === "progress") row.appendChild(el("span", "akind", "progress"));
      const b = el("b", null, a.who); row.appendChild(b);
      row.appendChild(document.createTextNode(" · " + fmtTime(a.ts) + "\n" + a.text));
      act.appendChild(row);
    }
  } else {
    act.appendChild(el("div", "empty", "—"));
  }
  asec.appendChild(act);
  card.appendChild(asec);
  // Action row: comment / progress textarea + buttons + move + assign + flag + subtask
  const fsec = el("div", "tm-section");
  const ta = el("textarea");
  ta.placeholder = "Add a comment or progress note…";
  ta.value = boardUi.draftComments[t.id] || "";
  ta.addEventListener("input", () => boardUi.draftComments[t.id] = ta.value);
  fsec.appendChild(ta);
  const actions = el("div", "tm-actions");
  const cbtn = el("button", "btn secondary mini", "💬 Comment");
  cbtn.title = "Posted to the activity log" + (t.origin === "jira" ? " and the Jira issue" : "");
  cbtn.addEventListener("click", async () => {
    const text = ta.value.trim(); if (!text) return;
    const r = await boardPost("/api/board/comment", { taskId: t.id, text }, "Comment added");
    if (r.ok) { delete boardUi.draftComments[t.id]; }
  });
  actions.appendChild(cbtn);
  const pbtn = el("button", "btn mini", "📈 Progress");
  pbtn.title = "Internal progress note (not posted to Jira); folded into the description when the task moves";
  pbtn.addEventListener("click", async () => {
    const text = ta.value.trim(); if (!text) return;
    const r = await boardPost("/api/board/progress", { taskId: t.id, text }, "Progress posted");
    if (r.ok) { delete boardUi.draftComments[t.id]; }
  });
  actions.appendChild(pbtn);
  // Move select — includes Backlog/Archive pseudo-locations.
  const mv = el("select");
  const tloc = t.location ?? "board";
  const mkOpt = (val, label, sel) => { const o = el("option"); o.value = val; o.textContent = label; if (sel) o.selected = true; return o; };
  if (tloc === "backlog") mv.appendChild(mkOpt("backlog", "📥 Backlog", true));
  if (tloc === "archive") mv.appendChild(mkOpt("archive", "🗄 Archive", true));
  for (const c of board.columns) mv.appendChild(mkOpt(c.id, c.name, tloc === "board" && c.id === t.columnId));
  if (tloc !== "backlog") mv.appendChild(mkOpt("backlog", "📥 Backlog", false));
  if (tloc !== "archive") mv.appendChild(mkOpt("archive", "🗄 Archive", false));
  mv.title = "Move to column / backlog / archive";
  mv.addEventListener("change", () => boardPost("/api/board/move", { taskId: t.id, column: mv.value }, "Moved"));
  actions.appendChild(mv);
  // Assign select
  const as = el("select");
  const optNone = el("option"); optNone.value = ""; optNone.textContent = "→ assign…"; as.appendChild(optNone);
  const optClear = el("option"); optClear.value = "__unassign__"; optClear.textContent = "(unassign)"; as.appendChild(optClear);
  for (const p of agentPickList()) {
    const o = el("option"); o.value = p.name; o.textContent = p.name + (p.idle ? " · idle" : "");
    if (p.name === t.assignee) o.selected = true;
    as.appendChild(o);
  }
  as.title = "Assign to agent (mails them the task)";
  as.addEventListener("change", () => {
    if (!as.value) return;
    const assignee = as.value === "__unassign__" ? "" : as.value;
    boardPost("/api/board/assign", { taskId: t.id, assignee, newSession: boardUi.freshSession },
      assignee ? "Assigned to " + assignee + " (mailed)" : "Unassigned");
  });
  actions.appendChild(as);
  // Flag / clear
  if (t.flagged) {
    const clr = el("button", "btn secondary mini", "Clear ⚠");
    clr.addEventListener("click", () => boardPost("/api/board/flag", { taskId: t.id, clear: true }, "Flag cleared"));
    actions.appendChild(clr);
  } else {
    const flg = el("button", "btn secondary mini", "Flag ⚠");
    flg.title = "Uses the text box as the reason";
    flg.addEventListener("click", () => {
      const reason = ta.value.trim() || "needs clarification";
      boardPost("/api/board/flag", { taskId: t.id, reason }, "Flagged as unclear").then(r => { if (r.ok) delete boardUi.draftComments[t.id]; });
    });
    actions.appendChild(flg);
  }
  // Subtask
  const sub = el("button", "btn secondary mini", "＋ Subtask");
  sub.addEventListener("click", () => {
    const summary = prompt("Subtask summary" + (t.origin === "jira" ? " (created as a Jira sub-task)" : "") + ":");
    if (summary && summary.trim()) boardPost("/api/board/create", { summary: summary.trim(), parent: t.id }, "Subtask created");
  });
  actions.appendChild(sub);
  fsec.appendChild(actions);
  card.appendChild(fsec);
  // Preserve scroll positions of the description + activity containers and
  // the textarea's focus/selection across the poll-driven rebuild, so reading
  // a long activity log isn't reset to the top every 3s. (The focus guard in
  // refresh() already suppresses re-render while typing; this covers passive
  // reading and any render that slips through.)
  let descScroll = 0, actScroll = 0, taFocus = false, taStart = 0, taEnd = 0;
  {
    const oldDesc = m.querySelector(".tm-desc"); if (oldDesc) descScroll = oldDesc.scrollTop;
    const oldAct = m.querySelector(".tm-act"); if (oldAct) actScroll = oldAct.scrollTop;
    const oldTa = m.querySelector("textarea");
    if (oldTa) {
      taFocus = document.activeElement === oldTa;
      taStart = oldTa.selectionStart ?? 0; taEnd = oldTa.selectionEnd ?? 0;
    }
  }
  m.innerHTML = "";
  m.appendChild(card);
  const newDesc = m.querySelector(".tm-desc"); if (newDesc) newDesc.scrollTop = descScroll;
  const newAct = m.querySelector(".tm-act"); if (newAct) newAct.scrollTop = actScroll;
  if (taFocus) {
    const newTa = m.querySelector("textarea");
    if (newTa) { newTa.focus(); try { newTa.setSelectionRange(taStart, taEnd); } catch {} }
  }
}

/** Order a column's tasks so subtasks follow their parent when co-located. */
function orderColumnTasks(tasks, board) {
  const inCol = new Set(tasks.map(t => t.id));
  const isTop = t => !isSubtask(t) || !(board.tasks ?? []).some(p =>
    inCol.has(p.id) && (p.id === t.parentId || (t.parentKey && p.key === t.parentKey)));
  const tops = tasks.filter(isTop).sort((a, b) => b.updatedAt - a.updatedAt);
  const out = [];
  for (const t of tops) {
    out.push(t);
    for (const c of tasks) {
      if (c !== t && (c.parentId === t.id || (t.key && c.parentKey === t.key))) out.push(c);
    }
  }
  return out;
}

function boardSettingsCard(board) {

  const inTok = el("input"); inTok.type = "password"; inTok.placeholder = board._cfg?.apiTokenSet ? "••••••••" : "paste a Jira API token";
  card.appendChild(inTok);

  // Columns editor — draft lives in boardUi so poll re-renders don't wipe edits
  card.appendChild(el("label", null, "Columns — order matters; blank Jira status = board-only column with instructions"));
  const colWrap = el("div");
  if (!boardUi.colsDraft) boardUi.colsDraft = board.columns.map(c => ({ ...c }));
  const rows = boardUi.colsDraft;
  const renderCols = () => {
    colWrap.innerHTML = "";
    rows.forEach((c, i) => {
      const r = el("div", "colrow");
      const rr = el("div", "rr");
      const inName = el("input"); inName.value = c.name; inName.placeholder = "Column name";

      const down = el("button", "btn secondary mini", "↓");

      const del = el("button", "btn secondary mini", "✕");

/** State for the directory picker: current path + cached ls results. */
const spawnUi = { path: "", dirs: [], manualMode: false, loadingLs: false };

/** Open the spawn modal with the directory picker. */
async function openSpawnModal() {

/** Fetch a directory listing for `path` (any directory on the filesystem). */
async function spawnLs(path) {
  spawnUi.loadingLs = true;
  if (document.getElementById("spawnModal")) renderSpawnModal();
  try {
    const hidden = spawnUi.showHidden ? "&hidden=1" : "";
    const r = await fetch("/api/spawn/ls?path=" + encodeURIComponent(path) + hidden).then(r => r.json());
    if (r.ok) { spawnUi.path = r.dir; spawnUi.dirs = r.dirs; spawnUi.manualMode = false; }
    else { spawnUi.dirs = []; toast("❌ " + (r.error || "ls failed"), true); }
  } catch (e) { toast("❌ ls failed: " + e.message, true); }
  spawnUi.loadingLs = false;
  if (document.getElementById("spawnModal")) renderSpawnModal();
}

/** Open a web terminal (xterm.js) over a WebSocket to a spawned tmux session. */
function openTerminal(name) {
  closeModal("termOverlay");
  if (typeof Terminal === "undefined") { toast("❌ xterm.js failed to load (offline?); cannot open terminal", true); return; }
  const overlay = el("div", "term-overlay"); overlay.id = "termOverlay";
  overlay.addEventListener("click", (e) => { if (e.target === overlay) closeTerminal(); });
  const card = el("div", "card");
  const bar = el("div", "bar");
  bar.appendChild(el("h3", null, "🖥 Terminal — " + name));
  const closeBtn = el("button", "btn secondary mini", "Close"); closeBtn.addEventListener("click", closeTerminal);
  bar.appendChild(closeBtn);
  card.appendChild(bar);
  const host = el("div"); host.id = "xterm-host";
  card.appendChild(host);
  overlay.appendChild(card);
  document.body.appendChild(overlay);

  const term = new Terminal({ cursorBlink: true, fontSize: 13, fontFamily: "monospace", scrollback: 5000 });
  const fit = new FitAddon.FitAddon();
  term.loadAddon(fit);
  term.open(host);
  try { fit.fit(); } catch {}
  term.writeln("Connecting to " + name + "…");

  const proto = location.protocol === "https:" ? "wss:" : "ws:";
  const ws = new WebSocket(`${proto}//${location.host}/api/spawn/terminal?name=${encodeURIComponent(name)}`);
  ws.binaryType = "arraybuffer";
  term.termWs = ws; term.termFit = fit; // stash for teardown
  termOpen = term;

  ws.onopen = () => { /* stream starts */ };
  ws.onmessage = (ev) => {
    const data = ev.data instanceof ArrayBuffer ? new Uint8Array(ev.data) : ev.data;
    term.write(data);
  };
  ws.onclose = () => { try { term.writeln("\r\n[disconnected]"); } catch {} };
  ws.onerror = () => { try { term.writeln("\r\n[error]"); } catch {} };
  term.onData((d) => { if (ws.readyState === WebSocket.OPEN) ws.send(new TextEncoder().encode(d)); });

  // Refit on window resize.
  const onResize = () => { try { fit.fit(); } catch {} };
  window.addEventListener("resize", onResize);
  term.termOnResize = onResize;
}

let termOpen = null;
function closeTerminal() {
  if (termOpen) {
    try { if (termOpen.termWs) termOpen.termWs.close(); } catch {}
    try { if (termOpen.termOnResize) window.removeEventListener("resize", termOpen.termOnResize); } catch {}
    try { termOpen.dispose(); } catch {}
    termOpen = null;
  }
  closeModal("termOverlay");
}

  }
  for (const m of standalone) outboxCard.appendChild(messageRow(m, { showTo: true }));
  for (const [bid, msgs] of groups) {
    const g = el("div", "group");
    g.appendChild(el("div", "gtitle", `📡 broadcast · ${msgs.length} recipient${msgs.length === 1 ? "" : "s"} · ${fmtTime(msgs[0].timestamp)}`));
    for (const m of msgs.sort((a, b) => a.toName < b.toName ? -1 : 1)) g.appendChild(messageRow(m, { showTo: true }));
    outboxCard.appendChild(g);
  }
  right.appendChild(outboxCard);

  grid.appendChild(right);
  main.appendChild(grid);
}

function renderHistory() {
  main.innerHTML = "";
  const card = el("div", "card");
  card.appendChild(el("h2", null, "Mail history per agent"));
  const pick = el("select", "agentpick");
  const def = el("option"); def.value = ""; def.textContent = "— select an agent —"; pick.appendChild(def);
  const sorted = sortAgents(state.agents);
  for (const a of sorted) {
    const o = el("option"); o.value = a.agentId;
    o.textContent = (a.isHuman ? "👤 " : "  ") + a.agentName + (a.isHuman ? " (you)" : "");
    pick.appendChild(o);
  }
  if (historyAgentId) pick.value = historyAgentId;
  card.appendChild(pick);
  card.appendChild(el("div", null, "")).style.height = "10px";

  const list = el("div"); list.style.marginTop = "8px";
  if (!historyAgentId) {
    list.appendChild(el("div", "empty", "Pick an agent to see all mail delivered to it (including archived and broadcasts)."));
  } else {
    const msgs = state.messages.filter(m => m.toId === historyAgentId)
      .sort((a, b) => b.timestamp - a.timestamp);
    if (!msgs.length) list.appendChild(el("div", "empty", "No mail for this agent."));
    for (const m of msgs) list.appendChild(messageRow(m, { showFrom: true }));
  }
  card.appendChild(list);
  main.appendChild(card);

  pick.addEventListener("change", () => { historyAgentId = pick.value; syncHash(); renderHistory(); });
}

// ── URL routing + tabs + polling ─────────────────────────────────────────────
// The active tab (and the selected agent in History) live in the URL hash so
// a page refresh — or browser back/forward — restores the view instead of
// always dropping back onto the Agents tab. setTab updates state, renders
// synchronously (so immediate follow-ups like scrollIntoView still work), and
// pushes the hash; the hashchange listener handles navigations that arrive
// from outside setTab (back/forward, initial deep-link) and no-ops when the
// hash already matches in-memory state (no render loop).
const VALID_TABS = ["agents", "board", "mailbox", "history"];

function routeFor(tab, agentId) {
  if (tab === "history" && agentId) return "history/" + agentId;
  return tab;
}
function parseRoute(hash) {
  const h = (hash || "").replace(/^#\/?/, ""); // strip leading "#" and optional "/"
  const [tab, agentId] = h.split("/");
  if (!VALID_TABS.includes(tab)) return { tab: "agents", agentId: "" };
  return { tab, agentId: agentId || "" };
}
// Apply the URL hash to in-memory state; returns true if it changed anything
// (so the caller can skip a redundant re-render). Does not touch the hash.
function applyRouteFromHash() {
  const { tab, agentId } = parseRoute(location.hash);
  let changed = false;
  if (tab !== currentTab) { currentTab = tab; changed = true; }
  if (tab === "history" && agentId && agentId !== historyAgentId) { historyAgentId = agentId; changed = true; }
  document.querySelectorAll("nav button").forEach(x => x.classList.toggle("active", x.dataset.tab === currentTab));
  return changed;
}
// Push the current tab (+ history selection) into the URL hash. No-op if it
// already matches, so this never triggers a hashchange→render loop. Uses the
// "/" prefix so the fragment never matches a real element id (no scroll jump).
function syncHash() {
  const want = "#/" + routeFor(currentTab, currentTab === "history" ? historyAgentId : "");
  if (location.hash !== want) location.hash = want;
}

function setTab(name) {
  currentTab = name;
  if (name !== "board") closeTaskModal();
  document.querySelectorAll("nav button").forEach(x => x.classList.toggle("active", x.dataset.tab === name));
  syncHash();
  render();
}

document.querySelectorAll("nav button").forEach(b => {
  b.addEventListener("click", () => setTab(b.dataset.tab));
});

window.addEventListener("hashchange", () => { if (applyRouteFromHash()) render(); });

// Restore the view from the URL before the first render so a refresh keeps
// you on the page you were on (instead of always landing on Agents).
applyRouteFromHash();
refresh();
pollTimer = setInterval(refresh, 3000);
</script>
</body>
</html>
