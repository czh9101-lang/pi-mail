<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>pi-mail — Federation Console</title>
<link rel="stylesheet" href="/ui.css" />
<script src="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/lib/xterm.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@xterm/addon-fit@0.10.0/lib/addon-fit.min.js"></script>
</head>
<body>
<header>
  <div>
    <h1>📬 pi-mail Federation Console</h1>
    <div class="sub" id="status">connecting…</div>
  </div>
  <nav>
    <button data-tab="agents" class="active">Agents</button>
    <button data-tab="board">Board</button>
    <button data-tab="mailbox">My Mailbox</button>
    <button data-tab="history">History</button>
  </nav>
</header>
<main id="main"></main>
<div id="toast" class="toast hidden"></div>

<!-- Split for readability (each file ≤600 lines). Classic scripts share the
     global lexical scope, so top-level let/const/function are visible across
     files. Order matters: core state/helpers → board+spawn+terminal → app. -->
<script src="/ui-core.js"></script>
<script src="/ui-board.js"></script>
<script src="/ui-app.js"></script>
</body>
</html>
